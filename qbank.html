<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QBank &middot; MCCQE1</title>
<style>
  :root{
    --paper:#faf9f6; --card:#ffffff; --ink:#16202e; --muted:#6b7280;
    --line:#e2e0d9; --line-strong:#c9c6bc;
    --accent:#1c5d7a;            /* clinical slate-blue */
    --accent-soft:#e8f1f5;
    --ochre:#a8752a;             /* reference / Toronto Notes marker */
    --ochre-soft:#faf3e6;
    --ok:#1f6b4f;  --ok-soft:#e8f3ee;
    --no:#a33a2c;  --no-soft:#f8eae7;
    --radius:10px;
    --shadow:0 1px 2px rgba(22,32,46,.04), 0 8px 24px -20px rgba(22,32,46,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:780px;margin:0 auto;padding:20px 16px 64px}

  /* header */
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
  .kicker{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  h1{font-size:24px;margin:7px 0 3px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}

  /* buttons */
  button{font-family:inherit}
  .btn{font:600 12.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.03em;
    background:var(--card);border:1px solid var(--line-strong);color:var(--ink);
    padding:9px 12px;border-radius:8px;cursor:pointer;transition:border-color .15s,color .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible,.opt:focus-visible,.chap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* chapter list */
  .chapters{display:grid;gap:7px;grid-template-columns:1fr}
  @media(min-width:620px){.chapters{grid-template-columns:1fr 1fr}}
  .chap{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
    transition:border-color .15s}
  .chap:hover:not(:disabled){border-color:var(--accent)}
  .chap:disabled{opacity:.48;cursor:default;box-shadow:none}
  .chap .nm{font-size:14.5px;font-weight:600;display:block}
  .chap .pg{font:10.5px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);display:block;margin-top:2px}
  .tag{font:600 10.5px/1 ui-monospace,Menlo,monospace;padding:5px 8px;border-radius:14px;white-space:nowrap;flex:none}
  .tag.has{background:var(--accent-soft);color:var(--accent)}
  .tag.none{background:#f0eee8;color:var(--muted)}

  /* generic card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:var(--shadow)}

  /* quiz */
  .qmeta{display:flex;justify-content:space-between;gap:10px;
    font:11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:12px}
  .stem{font-size:17.5px;line-height:1.5;margin:0 0 15px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;font-size:15px;cursor:pointer;transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt .ltr{font:700 12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);flex:none}
  .opt.correct{background:var(--ok-soft);border-color:var(--ok)}
  .opt.correct .ltr{color:var(--ok)}
  .opt.wrong{background:var(--no-soft);border-color:var(--no)}
  .opt.wrong .ltr{color:var(--no)}

  .reveal{margin-top:15px;padding-top:13px;border-top:1px dashed var(--line-strong);display:none}
  .reveal.show{display:block}
  .verdict{font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.09em;
    text-transform:uppercase;margin-bottom:7px}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
  .expl{font-size:15px;margin-bottom:13px}
  .ref{background:var(--ochre-soft);border-left:3px solid var(--ochre);
    border-radius:0 8px 8px 0;padding:11px 13px}
  .ref .rh{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ochre);margin-bottom:5px}
  .ref .rp{font:11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:7px}
  .ref ul{margin:0;padding-left:17px}
  .ref li{font-size:14px;margin-bottom:3px}
  .navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* import */
  textarea{width:100%;min-height:220px;font:12.5px/1.5 ui-monospace,Menlo,monospace;
    padding:11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--paper);color:var(--ink);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .note{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .msg{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.good{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
  .msg.bad{background:var(--no-soft);color:var(--no);border:1px solid var(--no)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{font:10.5px/1.3 ui-monospace,Menlo,monospace;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em}

  .empty{text-align:center;padding:44px 18px;color:var(--muted)}
  .empty h2{color:var(--ink);font-size:19px;margin:0 0 8px}
  .empty p{margin:0 auto 16px;max-width:420px;font-size:14.5px}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);text-align:center}
  .hide{display:none !important}
  /* --- 100-day plan --- */
  .planhero{margin-bottom:14px}
  .planheadrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 8px}
  .pfill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .planmeta{display:flex;justify-content:space-between;align-items:center;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted)}
  .planrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn.tiny{padding:4px 10px;font-size:12px}
  .phasehead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 6px;
    font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
  .phname{color:var(--accent)} .phrange{color:var(--muted);font-weight:400}
  .daylist{display:flex;flex-direction:column;gap:6px}
  .dayrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .dayrow:hover{border-color:var(--accent)}
  .dayrow.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .dayrow.done{opacity:.62}
  .dnum{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--muted);flex:none;width:30px}
  .dbody{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .dsubj{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:3px 6px;border-radius:5px;flex:none}
  .tag.mcq{background:var(--accent-soft,rgba(160,120,60,.15));color:var(--accent)}
  .tag.content{background:var(--line);color:var(--muted)}
  .dscore{font:12px/1 ui-monospace,Menlo,monospace;color:var(--muted);flex:none}
  .dcheck{color:var(--ok);font-weight:700;flex:none;width:16px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
  .chip:hover{border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

function readJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    var v = JSON.parse(raw);
    return v === null || v === undefined ? fallback : v;
  }catch(e){ return fallback; }
}
function writeJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}

function planState(){
  return readJSON(K_PLAN, {startDate:null, done:{}, mcqScores:{}});
}
function planSave(p){ writeJSON(K_PLAN, p); }

function planDayInfo(n){
  for(var i=0;i<SCHEDULE.length;i++){ if(SCHEDULE[i][0]===n) return SCHEDULE[i]; }
  return null;
}
function currentPlanDay(){
  var p = planState();
  if(!p.startDate) return 0;                 /* not started */
  var ms = Date.now() - p.startDate;
  var d = Math.floor(ms / 86400000) + 1;     /* day 1 on start date */
  if(d < 1) d = 1; if(d > 100) d = 100;
  return d;
}
function planStats(){
  var p = planState(), done=0;
  for(var k in p.done){ if(p.done[k]) done++; }
  return {done:done, total:100, pct:Math.round(done/100*100)};
}

/* ---- a single day's detail / action ---- */

  var p = planState();
  var info = planDayInfo(n); if(!info) return;
  var subj = SUBJECTS[info[1]], typ=info[2], phase=info[3];
  var isDone = !!p.done[n];
  planViewDay = n;

  var body;
  if(typ==="M"){
    body =
      '<p class="muted">An MCQ set drawn from this bank across '+subj.name+' chapters. Your score is saved against the day.</p>' +
      '<button class="btn primary" id="planStartMcq">Start MCQ set ('+subj.name+')</button>';
  } else {
    var chips = "";
    for(var i=0;i<subj.chapters.length;i++){
      chips += '<button class="chip" data-planchap="'+subj.chapters[i]+'">'+esc(chapterName(subj.chapters[i]))+'</button>';
    }
    body =
      '<p class="muted">A content review day for '+subj.name+'. Work the reference material in your Toronto Notes for these chapters, then drill any chapter here to check retention.</p>' +
      '<div class="chips">'+chips+'</div>';

  view.innerHTML =
    '<div class="card">' +
      '<div class="qmeta"><span>Day '+n+' \u00b7 '+PHASES[phase]+'</span>' +
        '<span>'+(typ==="M"?"MCQ":"Content")+'</span></div>' +

      body +
      (mcq ? '<p class="muted">Last MCQ score: '+mcq.right+'/'+mcq.total+'</p>' : "") +
      '<div class="planrow">' +
        '<button class="btn '+(isDone?'':'primary')+'" id="planToggleDone">'+(isDone?"Mark not done":"Mark day complete")+'</button>' +
        '<button class="btn" data-go="plan">Back to plan</button>' +
      '</div>' +
    '</div>';
}

/* ---- start an MCQ set for a plan day: pull from the day's chapters ---- */
function startPlanMcq(n){
  var info = planDayInfo(n); if(!info) return;
  var subj = SUBJECTS[info[1]];
  var pool = [];
  for(var i=0;i<subj.chapters.length;i++){
    pool = pool.concat(questionsIn(subj.chapters[i]));
  }
  if(!pool.length){ openPlanDay(n); return; }
  var pick = shuffle(pool).slice(0, Math.min(10, pool.length));
  state.screen = "quiz";
  state.list = pick;
  state.idx = 0;
  state.label = "Day "+n+" \u00b7 "+subj.name+" MCQ";
  state.planDay = n;            /* tag so completion saves the score */
  state.planRight = 0;
  renderQuestion();
}


/* ------------------------------------------------------------------ *
 * Helpers
 * ------------------------------------------------------------------ */
function esc(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function chapterName(id){
  for(var i=0;i<CHAPTERS.length;i++){ if(CHAPTERS[i].id === id) return CHAPTERS[i].name; }
  return id;
}
function chapterPages(id){
  for(var i=0;i<CHAPTERS.length;i++){ if(CHAPTERS[i].id === id) return CHAPTERS[i].pages; }
  return "";
}
function questionsIn(id){
  return QUESTIONS.filter(function(q){ return q.chapter === id; });
}
function missedQuestions(){
  return QUESTIONS.filter(function(q){
    var p = PROGRESS[q.id];
    return p && p.correct === false;
  });
}
function shuffle(a){
  var arr = a.slice();
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ------------------------------------------------------------------ *
 * State + routing
 * ------------------------------------------------------------------ */
var view = document.getElementById("view");
var state = { screen:"home", list:[], idx:0, answered:false, label:"" };

function setSub(){
  var seen = 0, right = 0;
  for(var k in PROGRESS){
    if(Object.prototype.hasOwnProperty.call(PROGRESS,k)){
      seen++; if(PROGRESS[k].correct) right++;
    }
  }
  var built = 0;
  for(var i=0;i<CHAPTERS.length;i++){ if(questionsIn(CHAPTERS[i].id).length) built++; }
  document.getElementById("sub").textContent =
    QUESTIONS.length + " questions \u00b7 " + built + " of " + CHAPTERS.length +
    " chapters built \u00b7 " + right + "/" + seen + " answered correctly";
}

function go(screen){
  state.screen = screen;
  if(screen === "home") renderHome();
  else if(screen === "plan") renderPlan();
  else if(screen === "import") renderImport();
  else if(screen === "manage") renderManage();
  else if(screen === "review") startReview();
  setSub();
}

/* ------------------------------------------------------------------ *
 * Home
 * ------------------------------------------------------------------ */
function renderHome(){
  if(!QUESTIONS.length){
    view.innerHTML =
      '<div class="card empty">' +
        '<h2>The bank is empty</h2>' +
        '<p>Add a question pack to start studying. Packs are JSON, and each question ' +
        'carries its own Toronto Notes reference.</p>' +
        '<div class="row" style="justify-content:center">' +
          '<button class="btn primary" data-go="import">Add questions</button>' +
          '<button class="btn" data-go="manage">Restore a backup</button>' +
        '</div>' +
      '</div>';
    return;
  }
  var seen = 0, right = 0;
  for(var k in PROGRESS){
    if(Object.prototype.hasOwnProperty.call(PROGRESS,k)){
      seen++; if(PROGRESS[k].correct) right++;
    }
  }
  var missed = missedQuestions().length;
  var pct = seen ? Math.round(right/seen*100) : 0;

  var html =
    '<div class="stats">' +
      '<div class="stat"><b>' + QUESTIONS.length + '</b><span>Questions</span></div>' +
      '<div class="stat"><b>' + pct + '%</b><span>Accuracy</span></div>' +
      '<div class="stat"><b>' + missed + '</b><span>To review</span></div>' +
    '</div>';

  var rows = "";
  for(var i=0;i<CHAPTERS.length;i++){
    var c = CHAPTERS[i];
    var qs = questionsIn(c.id);
    var n = qs.length;
    var correct = 0;
    for(var j=0;j<qs.length;j++){
      var p = PROGRESS[qs[j].id];
      if(p && p.correct) correct++;
    }
    var tag = n
      ? '<span class="tag has">' + correct + '/' + n + '</span>'
      : '<span class="tag none">empty</span>';
    rows +=
      '<button class="chap" data-chapter="' + esc(c.id) + '"' + (n ? "" : " disabled") + '>' +
        '<span><span class="nm">' + esc(c.name) + '</span>' +
        '<span class="pg">Toronto Notes p' + esc(c.pages) + '</span></span>' +
        tag +
      '</button>';
  }
  view.innerHTML = html + '<div class="chapters">' + rows + '</div>';
}

/* ------------------------------------------------------------------ *
 * Quiz
 * ------------------------------------------------------------------ */
function startChapter(id){
  var qs = questionsIn(id);
  if(!qs.length){ go("home"); return; }
  state.screen = "quiz";
  state.list = shuffle(qs);
  state.idx = 0;
  state.label = chapterName(id);
  renderQuestion();
}

function startReview(){
  var qs = missedQuestions();
  if(!qs.length){
    view.innerHTML =
      '<div class="card empty">' +
        '<h2>Nothing to review</h2>' +
        '<p>Questions you answer incorrectly collect here so you can work through them again.</p>' +
        '<button class="btn primary" data-go="home">Back to chapters</button>' +
      '</div>';
    return;
  }
  state.screen = "quiz";
  state.list = shuffle(qs);
  state.idx = 0;
  state.label = "Review mistakes";
  renderQuestion();
}

function renderQuestion(){
  var q = state.list[state.idx];
  if(!q){ go("home"); return; }

  var opts = "";
  for(var i=0;i<q.options.length;i++){
    opts +=
      '<button class="opt" data-pick="' + i + '">' +
        '<span class="ltr">' + String.fromCharCode(65+i) + '</span>' +
        '<span>' + esc(q.options[i]) + '</span>' +
      '</button>';
  }

  var refHTML = "";
  if(q.ref){
    var pts = "";
    var list = q.ref.points || [];
    for(var p=0;p<list.length;p++){ pts += '<li>' + esc(list[p]) + '</li>'; }
    refHTML =
      '<div class="ref">' +
        '<div class="rh">Toronto Notes \u00b7 ' + esc(chapterName(q.chapter)) + '</div>' +
        (q.ref.pages ? '<div class="rp">' + esc(q.ref.pages) + '</div>' : "") +
        (pts ? '<ul>' + pts + '</ul>' : "") +
      '</div>';
  }

  view.innerHTML =
    '<div class="card">' +
      '<div class="qmeta"><span>' + esc(state.label) + '</span>' +
        '<span>' + (state.idx+1) + ' / ' + state.list.length + '</span></div>' +
      '<p class="stem serif">' + esc(q.stem) + '</p>' +
      '<div class="opts" id="opts">' + opts + '</div>' +
      '<div class="reveal" id="reveal">' +
        '<div class="verdict" id="verdict"></div>' +
        '<div class="expl">' + esc(q.explanation) + '</div>' +
        refHTML +
      '</div>' +
      '<div class="navrow">' +
        '<button class="btn" data-go="home">Chapters</button>' +
        '<button class="btn primary hide" id="next">Next</button>' +
      '</div>' +
    '</div>';
  state.answered = false;
}

function pick(i){
  if(state.answered) return;
  state.answered = true;

  var q = state.list[state.idx];
  var correct = (i === q.answer);
  var buttons = document.querySelectorAll("#opts .opt");

  for(var j=0;j<buttons.length;j++){
    buttons[j].disabled = true;
    if(j === q.answer) buttons[j].className = "opt correct";
    if(j === i && !correct) buttons[j].className = "opt wrong";
  }

  var v = document.getElementById("verdict");
  v.textContent = correct ? "Correct" : "Not quite";
  v.className = "verdict " + (correct ? "ok" : "no");
  document.getElementById("reveal").className = "reveal show";
  document.getElementById("next").className = "btn primary";

  PROGRESS[q.id] = { correct: correct, at: Date.now() };
  writeJSON(K_P, PROGRESS);
  setSub();
}

function next(){
  if(state.idx < state.list.length - 1){
    state.idx++;
    renderQuestion();
  } else {
    var right = 0;
    for(var i=0;i<state.list.length;i++){
      var p = PROGRESS[state.list[i].id];
      if(p && p.correct) right++;
    }
    var backPlan = "";
    if(state.planDay){
      var pl = planState();
      pl.mcqScores[state.planDay] = { right: right, total: state.list.length };
      pl.done[state.planDay] = true;   /* completing the MCQ set marks the day done */
      planSave(pl);
      backPlan = '<button class="btn primary" data-go="plan">Back to plan</button>';
      state.planDay = 0;
    }
    view.innerHTML =
      '<div class="card empty">' +
        '<h2>' + esc(state.label) + ' complete</h2>' +
        '<p>' + right + ' of ' + state.list.length + ' correct this round.</p>' +
        '<div class="row" style="justify-content:center">' +
          backPlan +
          '<button class="btn primary" data-go="home">Back to chapters</button>' +
          '<button class="btn" data-go="review">Review mistakes</button>' +
        '</div>' +
      '</div>';
  }
}

var SAMPLE = [{
  id:"endo_001",
  chapter:"endo",
  stem:"Question text goes here.",
  options:["Option A","Option B","Option C","Option D"],
  answer:0,
  explanation:"Why the correct option is correct and the others are not.",
  ref:{ pages:"p312 — Section name", points:["Key point one.","Key point two."] }

function showMsg(text, good){
  var m = document.getElementById("msg");
  if(!m) return;
  m.textContent = text;
  m.className = "msg show " + (good ? "good" : "bad");
}

function validPack(data){
  if(!Array.isArray(data)) return "Expected a JSON array of questions.";
  if(!data.length) return "That pack is empty.";
  var valid = {};
  for(var i=0;i<CHAPTERS.length;i++){ valid[CHAPTERS[i].id] = true; }
  for(var n=0;n<data.length;n++){
    var q = data[n], where = "Question " + (n+1);
    if(!q || typeof q !== "object") return where + " is not an object.";
    if(!q.id) return where + " is missing an id.";
    if(!q.chapter || !valid[q.chapter]) return where + ' has an unknown chapter: "' + q.chapter + '".';
    if(!q.stem) return where + " is missing a stem.";
    if(!Array.isArray(q.options) || q.options.length < 2) return where + " needs at least two options.";
    if(typeof q.answer !== "number" || q.answer < 0 || q.answer >= q.options.length){
      return where + " has an answer index outside its options.";
    }
    if(!q.explanation) return where + " is missing an explanation.";
  }
  return null;
}

function mergePack(data){
  if(data && !Array.isArray(data) && Array.isArray(data.questions)) data = data.questions;

  var problem = validPack(data);
  if(problem){ showMsg(problem, false); return false; }

  var index = {};
  for(var i=0;i<QUESTIONS.length;i++){ index[QUESTIONS[i].id] = i; }
  var added = 0, replaced = 0;
  for(var n=0;n<data.length;n++){
    var q = data[n];
    if(index[q.id] !== undefined){ QUESTIONS[index[q.id]] = q; replaced++; }
    else { QUESTIONS.push(q); index[q.id] = QUESTIONS.length - 1; added++; }
  }

  if(!writeJSON(K_Q, QUESTIONS)){
    showMsg("Could not save — this browser's storage is full.", false);
    return false;
  }
  showMsg("Added " + added + " new question" + (added===1?"":"s") +
    (replaced ? " and updated " + replaced : "") + ".", true);
  setSub();
  return true;
}

function doImport(){
  var box = document.getElementById("paste");
  var raw = box ? box.value.trim() : "";
  if(!raw){ showMsg("Paste a question pack first, or use Load pack file.", false); return; }

  var data;
  try{ data = JSON.parse(raw); }
  catch(e){ showMsg("That is not valid JSON. " + e.message, false); return; }

  if(mergePack(data) && box) box.value = "";
}

function doLoadPack(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ showMsg("That file is not valid JSON.", false); return; }
    mergePack(data);
  };
  reader.onerror = function(){ showMsg("Could not read that file.", false); };
  reader.readAsText(file);
  ev.target.value = "";
}

function doExport(){
  var payload = { app:"qbank", version:1, exported:new Date().toISOString(),
                  questions:QUESTIONS, progress:PROGRESS, plan:planState() };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "qbank-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showMsg("Backup downloaded.", true);
}

function doRestore(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ showMsg("That file is not valid JSON.", false); return; }
    var qs = Array.isArray(data) ? data : data.questions;
    var problem = validPack(qs);
    if(problem){ showMsg(problem, false); return; }
    QUESTIONS = qs;
    if(data && data.progress && typeof data.progress === "object"){
      PROGRESS = data.progress;
      writeJSON(K_P, PROGRESS);
    }
    if(data && data.plan && typeof data.plan === "object"){
      planSave(data.plan);
    }
    writeJSON(K_Q, QUESTIONS);
    showMsg("Restored " + QUESTIONS.length + " questions.", true);
    setSub();
  };
  reader.onerror = function(){ showMsg("Could not read that file.", false); };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ------------------------------------------------------------------ *
 * Events — single delegated listener, no inline handlers
 * ------------------------------------------------------------------ */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-go],[data-chapter],[data-pick],button") : null;
  if(!t) return;

  if(t.hasAttribute && t.hasAttribute("data-go")){ go(t.getAttribute("data-go")); return; }
  if(t.hasAttribute && t.hasAttribute("data-chapter")){ startChapter(t.getAttribute("data-chapter")); return; }
  if(t.hasAttribute && t.hasAttribute("data-pick")){ pick(parseInt(t.getAttribute("data-pick"),10)); return; }
  if(t.hasAttribute && t.hasAttribute("data-planday")){ openPlanDay(parseInt(t.getAttribute("data-planday"),10)); return; }
  if(t.hasAttribute && t.hasAttribute("data-planchap")){ startChapter(t.getAttribute("data-planchap")); return; }

  if(t.id === "planStartToday"){
    var ps = planState(); var d0 = new Date(); d0.setHours(0,0,0,0);
    ps.startDate = d0.getTime(); planSave(ps); renderPlan(); return;
  }
  if(t.id === "planStartPick"){
    var di = document.getElementById("planDate");
    if(di){ di.style.display="block"; di.focus(); if(di.showPicker){ try{di.showPicker();}catch(e){} } }
    return;
  }
  if(t.id === "planJump"){
    var el = document.querySelector(".dayrow.today");
    if(el && el.scrollIntoView) el.scrollIntoView({block:"center"});
    return;
  }
  if(t.id === "planStartMcq"){ startPlanMcq(planViewDay); return; }
  if(t.id === "planToggleDone"){
    var pp = planState(); var n = planViewDay;
    pp.done[n] = !pp.done[n]; planSave(pp); openPlanDay(n); return;
  }

  switch(t.id){
    case "next": next(); break;
    case "doImport": doImport(); break;
    case "doSample":
      var box = document.getElementById("paste");
      if(box){ box.value = JSON.stringify(SAMPLE, null, 2); showMsg("Format shown — replace it with your pack.", true); }
      break;
    case "doExport": doExport(); break;
    case "doRestore": document.getElementById("file").click(); break;
    case "doLoadPack": document.getElementById("packfile").click(); break;
    case "doResetProgress":
      if(confirm("Clear which questions you have answered? Your questions are kept.")){
        PROGRESS = {}; writeJSON(K_P, PROGRESS); showMsg("Progress cleared.", true); setSub();
      }
      break;
    case "doWipe":
      if(confirm("Delete every question in this bank? Download a backup first if you want to keep them.")){
        QUESTIONS = []; PROGRESS = {};
        writeJSON(K_Q, QUESTIONS); writeJSON(K_P, PROGRESS);
        showMsg("All questions deleted.", true); setSub();
      }
      break;
  }
});

document.addEventListener("change", function(ev){
  if(!ev.target) return;
  if(ev.target.id === "file") doRestore(ev);
  else if(ev.target.id === "packfile") doLoadPack(ev);
  else if(ev.target.id === "planDate"){
    var parts = ev.target.value.split("-");
    if(parts.length === 3){
      var d0 = new Date(+parts[0], +parts[1]-1, +parts[2]); d0.setHours(0,0,0,0);
      var ps = planState(); ps.startDate = d0.getTime(); planSave(ps); renderPlan();
    }
  }
});

/* keyboard: 1-9 to pick, Enter/space for next */
document.addEventListener("keydown", function(ev){
  if(state.screen !== "quiz") return;
  var tag = document.activeElement ? document.activeElement.tagName : "";
  if(tag === "TEXTAREA" || tag === "INPUT") return;
  if(!state.answered && ev.key >= "1" && ev.key <= "9"){
    var i = parseInt(ev.key,10) - 1;
    var q = state.list[state.idx];
    if(q && i < q.options.length){ pick(i); ev.preventDefault(); }
  } else if(state.answered && (ev.key === "Enter" || ev.key === " ")){
    next(); ev.preventDefault();
  }
});

/* ------------------------------------------------------------------ *
 * Start
 * ------------------------------------------------------------------ */
go("home");
</script>
